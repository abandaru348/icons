<template>
    <lightning-layout multiple-rows>
        <lightning-layout-item size="12">
            <div class="tile-container">
                <h3 class="tile-title">Upcoming Appointments</h3>

                <div class="list-container" role="list">
                    <template for:each={appointments} for:item="appt">
                        <div key={appt.id} class="list-item" role="listitem">
                            <template if:true={isAuthenticated}>
                                <a class="item-link active" data-id={appt.id} onclick={handleItemClick}>
                                    <span class="item-icon" aria-hidden="true">🗓️</span>
                                    <div class="item-content">
                                        <div class="item-title">{appt.title}</div>
                                        <div class="item-sub">{appt.subTitle}</div>
                                    </div>
                                    <span class="item-date">{appt.dateLabel}</span>
                                </a>
                            </template>
                            <template if:false={isAuthenticated}>
                                <div class="item-link disabled">
                                    <span class="item-icon" aria-hidden="true">🗓️</span>
                                    <div class="item-content">
                                        <div class="item-title">{appt.title}</div>
                                        <div class="item-sub">{appt.subTitle}</div>
                                    </div>
                                    <span class="item-date">{appt.dateLabel}</span>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>

                <div class="tile-footer">
                    <a class="view-all" href="javascript:void(0)" onclick={handleViewAll}>View All</a>
                </div>
            </div>
        </lightning-layout-item>
    </lightning-layout>
</template>
