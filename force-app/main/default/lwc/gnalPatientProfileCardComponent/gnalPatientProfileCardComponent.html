<!--
/****************************************************************************************************
Created Date : [10-22-2025]
@description : Patient mini profile card shown on the right in mock.
               Kept independent to drop into any page layout. Header/footer ignored.
******************************************************************************************************/
-->
<template>
    <div class="tile-container">
        <lightning-layout class="header" vertical-align="center">
            <lightning-layout-item flexibility="shrink">
                <lightning-avatar initials={initials} size="medium" variant="circle" alternative-text="Patient"></lightning-avatar>
            </lightning-layout-item>
            <lightning-layout-item class="slds-p-left_small">
                <lightning-formatted-text value={fullName} class="name"></lightning-formatted-text>
            </lightning-layout-item>
        </lightning-layout>

        <lightning-layout class="fields" multiple-rows="true">
            <!-- Row 1: DOB (left) and Gender (right) -->
            <lightning-layout-item size="6" padding="horizontal-small" class="slds-p-vertical_x-small">
                <lightning-layout class="field" multiple-rows="true">
                    <lightning-layout-item size="12">
                        <lightning-formatted-text value="Date of Birth" class="label-text"></lightning-formatted-text>
                    </lightning-layout-item>
                    <lightning-layout-item size="12">
                        <lightning-formatted-text value={dob} class="value-text"></lightning-formatted-text>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="horizontal-small" class="slds-p-vertical_x-small">
                <lightning-layout class="field" multiple-rows="true">
                    <lightning-layout-item size="12">
                        <lightning-formatted-text value="Gender" class="label-text"></lightning-formatted-text>
                    </lightning-layout-item>
                    <lightning-layout-item size="12">
                        <lightning-formatted-text value={gender} class="value-text"></lightning-formatted-text>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>

            <!-- Row 2: DBN and DoD ID -->
            <lightning-layout-item size="6" padding="horizontal-small" class="slds-p-vertical_x-small">
                <lightning-layout class="field" multiple-rows="true">
                    <lightning-layout-item size="12">
                        <lightning-formatted-text value="DBN" class="label-text"></lightning-formatted-text>
                    </lightning-layout-item>
                    <lightning-layout-item size="12">
                        <lightning-formatted-text value={dbn} class="value-text"></lightning-formatted-text>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="horizontal-small" class="slds-p-vertical_x-small">
                <lightning-layout class="field" multiple-rows="true">
                    <lightning-layout-item size="12">
                        <lightning-formatted-text value="DoD ID #" class="label-text"></lightning-formatted-text>
                    </lightning-layout-item>
                    <lightning-layout-item size="12">
                        <lightning-formatted-text value={dodId} class="value-text"></lightning-formatted-text>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>

            <!-- Row 3: PCM Clinic and PMC -->
            <lightning-layout-item size="6" padding="horizontal-small" class="slds-p-vertical_x-small">
                <lightning-layout class="field" multiple-rows="true">
                    <lightning-layout-item size="12">
                        <lightning-formatted-text value="PCM Clinic" class="label-text"></lightning-formatted-text>
                    </lightning-layout-item>
                    <lightning-layout-item size="12">
                        <lightning-formatted-text value={pcmClinic} class="value-text"></lightning-formatted-text>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="horizontal-small" class="slds-p-vertical_x-small">
                <lightning-layout class="field" multiple-rows="true">
                    <lightning-layout-item size="12">
                        <lightning-formatted-text value="PMC" class="label-text"></lightning-formatted-text>
                    </lightning-layout-item>
                    <lightning-layout-item size="12">
                        <lightning-formatted-text value={pmc} class="value-text"></lightning-formatted-text>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
        </lightning-layout>

        <div class="tile-footer slds-text-align_right">
            <a class="slds-text-link" onclick={handleViewProfile}>View Profile</a>
        </div>
    </div>
</template>
