<!--
/****************************************************************************************************
Created Date : [10-22-2025]
@description : Patient mini profile card shown on the right in mock.
               Kept independent to drop into any page layout. Header/footer ignored.
******************************************************************************************************/
-->
<template>
    <lightning-card class="card-container">
        <lightning-layout class="header" vertical-align="center">
            <lightning-layout-item flexibility="shrink">
                <lightning-avatar initials={initials} size="medium" alternative-text="Patient"></lightning-avatar>
            </lightning-layout-item>
            <lightning-layout-item class="slds-p-left_small">
                <lightning-formatted-text value={fullName} class="name"></lightning-formatted-text>
            </lightning-layout-item>
        </lightning-layout>

        <lightning-layout class="fields" multiple-rows="true">
            <!-- Row 1: DOB (left) and Gender (right) -->
            <lightning-layout-item size="6" padding="horizontal-small" class="slds-p-vertical_x-small">
                <span class="label">Date of Birth</span>
                <span class="value">{dob}</span>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="horizontal-small" class="slds-p-vertical_x-small">
                <span class="label">Gender</span>
                <span class="value">{gender}</span>
            </lightning-layout-item>

            <!-- Row 2: DBN and DoD ID -->
            <lightning-layout-item size="6" padding="horizontal-small" class="slds-p-vertical_x-small">
                <span class="label">DBN</span>
                <span class="value">{dbn}</span>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="horizontal-small" class="slds-p-vertical_x-small">
                <span class="label">DoD ID #</span>
                <span class="value">{dodId}</span>
            </lightning-layout-item>

            <!-- Row 3: PCM Clinic and PMC -->
            <lightning-layout-item size="6" padding="horizontal-small" class="slds-p-vertical_x-small">
                <span class="label">PCM Clinic</span>
                <span class="value">{pcmClinic}</span>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="horizontal-small" class="slds-p-vertical_x-small">
                <span class="label">PMC</span>
                <span class="value">{pmc}</span>
            </lightning-layout-item>
        </lightning-layout>

        <lightning-layout slot="footer" horizontal-align="end">
            <lightning-layout-item>
                <lightning-button variant="base" label="View Profile" onclick={handleViewProfile}></lightning-button>
            </lightning-layout-item>
        </lightning-layout>
    </lightning-card>
</template>
