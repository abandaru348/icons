<template>
  <lightning-card title={title} class="gnal-card">
    <div class="slds-p-horizontal_small">
      <template if:true={description}>
        <p class="slds-text-body_regular slds-m-bottom_small">{description}</p>
      </template>

      <ul class="slds-has-dividers_around-space" role="list">
        <template for:each={normalizedLinks} for:item="l">
          <li key={l.key} class="slds-item" role="listitem">
            <template if:true={isAuthenticated}>
              <a class="slds-text-link_reset gnal-link" data-url={l.url} onclick={handleNavigate} aria-label={l.ariaLabel} title={l.ariaLabel}>
                <lightning-layout class="gnal-row" vertical-align="center" horizontal-align="spread" pull-to-boundary="small">
                  <lightning-layout-item flexibility="shrink">
                    <img if:true={l.icon} src={l.icon} alt="" class="gnal-icon" />
                  </lightning-layout-item>
                  <lightning-layout-item flexibility="grow" class="slds-p-horizontal_small">
                    <lightning-formatted-text value={l.label} class="slds-truncate"></lightning-formatted-text>
                    <template if:true={l.subText}>
                      <lightning-formatted-text value={l.subText} class="slds-text-color_weak slds-text-body_small slds-truncate"></lightning-formatted-text>
                    </template>
                  </lightning-layout-item>
                  <lightning-layout-item flexibility="shrink">
                    <template if:true={l.rightText}>
                      <lightning-formatted-text value={l.rightText} class="slds-text-body_small slds-text-color_weak"></lightning-formatted-text>
                    </template>
                  </lightning-layout-item>
                </lightning-layout>
              </a>
            </template>
            <template if:false={isAuthenticated}>
              <lightning-layout class="gnal-row gnal-item-disabled" vertical-align="center" horizontal-align="spread" pull-to-boundary="small" aria-disabled="true">
                <lightning-layout-item flexibility="shrink">
                  <img if:true={l.icon} src={l.icon} alt="" class="gnal-icon gnal-icon--disabled" />
                </lightning-layout-item>
                <lightning-layout-item flexibility="grow" class="slds-p-horizontal_small">
                  <lightning-formatted-text value={l.label} class="slds-truncate"></lightning-formatted-text>
                  <template if:true={l.subText}>
                    <lightning-formatted-text value={l.subText} class="slds-text-color_weak slds-text-body_small slds-truncate"></lightning-formatted-text>
                  </template>
                </lightning-layout-item>
                <lightning-layout-item flexibility="shrink">
                  <template if:true={l.rightText}>
                    <lightning-formatted-text value={l.rightText} class="slds-text-body_small slds-text-color_weak"></lightning-formatted-text>
                  </template>
                </lightning-layout-item>
              </lightning-layout>
            </template>
          </li>
        </template>
      </ul>

      <template if:true={footerUrlResolved}>
        <lightning-layout class="slds-m-top_small" horizontal-align="center">
          <lightning-layout-item>
            <lightning-button variant="base" label={footerLabelResolved} data-url={footerUrlResolved} onclick={handleLearnMore}></lightning-button>
          </lightning-layout-item>
        </lightning-layout>
      </template>
    </div>
  </lightning-card>
  </template>
