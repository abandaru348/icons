<template>
  <lightning-card title={title} class="gnal-card">
    <div class="slds-p-horizontal_small">
      <template lwc:if={description}>
        <p class="slds-text-body_regular slds-m-bottom_small">{description}</p>
      </template>

      <ul class="slds-has-dividers_around-space" role="list">
        <template for:each={normalizedLinks} for:item="l">
          <li key={l.key} class="slds-item" role="listitem">
            <template lwc:if={isAuthenticated}>
              <a
                class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-text-link_reset gnal-row"
                data-url={l.url}
                onclick={handleNavigate}
                aria-label={l.ariaLabel}
                title={l.ariaLabel}
              >
                <template lwc:if={l.icon}>
                  <img src={l.icon} alt="" class="gnal-icon" />
                </template>
                <div class="slds-p-horizontal_small gnal-mid">
                  <div class="gnal-primary">{l.label}</div>
                  <template lwc:if={l.subText}>
                    <div class="gnal-sub slds-text-color_weak slds-text-body_small">{l.subText}</div>
                  </template>
                </div>
                <template lwc:if={l.rightText}>
                  <span class="gnal-right slds-text-body_small slds-text-color_weak">{l.rightText}</span>
                </template>
              </a>
            </template>
            <template lwc:else>
              <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread gnal-item-disabled gnal-row" aria-disabled="true">
                <template lwc:if={l.icon}>
                  <img src={l.icon} alt="" class="gnal-icon gnal-icon--disabled" />
                </template>
                <div class="slds-p-horizontal_small gnal-mid">
                  <div class="gnal-primary">{l.label}</div>
                  <template lwc:if={l.subText}>
                    <div class="gnal-sub slds-text-color_weak slds-text-body_small">{l.subText}</div>
                  </template>
                </div>
                <template lwc:if={l.rightText}>
                  <span class="gnal-right slds-text-body_small slds-text-color_weak">{l.rightText}</span>
                </template>
              </div>
            </template>
          </li>
        </template>
      </ul>

      <template lwc:if={footerUrlResolved}>
        <lightning-layout class="slds-m-top_small" horizontal-align="center">
          <lightning-layout-item>
            <lightning-button variant="base" label={footerLabelResolved} data-url={footerUrlResolved} onclick={handleLearnMore}></lightning-button>
          </lightning-layout-item>
        </lightning-layout>
      </template>
    </div>
  </lightning-card>
</template>
