<template>
  <lightning-card title={title} class="gnal-card">
    <div class="gnal-card-body">
      <slot name="header"></slot>

      <template lwc:if={description}>
        <p class="gnal-description">{description}</p>
      </template>

      <ul class="gnal-list" role="list">
        <template for:each={normalizedLinks} for:item="l">
          <li key={l.key} class="gnal-list-item" role="listitem">
            <div
              class={l.rowClass}
              data-url={l.url}
              data-clickable={l.dataClickable}
              role={l.role}
              tabindex={l.tabIndex}
              aria-label={l.ariaLabel}
              aria-disabled={l.ariaDisabled}
              title={l.ariaLabel}
              onclick={handleNavigate}
              onkeydown={handleRowKeydown}
            >
              <template lwc:if={l.icon}>
                <span class="slds-col slds-grow-none gnal-icon-wrapper" style={l.iconStyle}>
                  <lightning-icon
                    class="gnal-icon"
                    icon-name={l.icon}
                    alternative-text={l.label}
                    title={l.label}
                    size="small"
                  ></lightning-icon>
                </span>
              </template>

              <div class="slds-col slds-grow gnal-content slds-p-horizontal_small">
                <div class="gnal-primary">{l.label}</div>

                <template lwc:if={l.subText}>
                  <div class="gnal-sub">{l.subText}</div>
                </template>
              </div>

              <template lwc:if={l.hasRightContent}>
                <div class="slds-col slds-grow-none slds-col_bump-left gnal-meta">
                  <template lwc:if={l.rightText}>
                    <span class="gnal-meta__text">{l.rightText}</span>
                  </template>
                  <template lwc:if={l.rightIcon}>
                    <span class="gnal-meta__icon" aria-hidden="true">
                      <lightning-icon
                        class="gnal-meta__icon-inner"
                        icon-name={l.rightIcon}
                        size="xx-small"
                        alternative-text=""
                        title=""
                      ></lightning-icon>
                    </span>
                  </template>
                </div>
              </template>
            </div>
          </li>
        </template>
      </ul>

      <template lwc:if={footerUrlResolved}>
        <lightning-layout class="gnal-footer" horizontal-align="center">
          <lightning-layout-item>
            <lightning-button
              variant="base"
              label={footerLabelResolved}
              data-url={footerUrlResolved}
              onclick={handleLearnMore}
            ></lightning-button>
          </lightning-layout-item>
        </lightning-layout>
      </template>
    </div>
  </lightning-card>
</template>
