<template>
  <lightning-card title={title} class="gnal-card">
    <div class="gnal-card-body">
        <slot name="header"></slot>

      <template lwc:if={description}>
        <p class="gnal-description">{description}</p>
      </template>

      <ul class="gnal-list" role="list">
        <template for:each={normalizedLinks} for:item="l">
          <li key={l.key} class="gnal-list-item" role="listitem">
            <template lwc:if={l.isClickable}>
              <a
                class="gnal-row gnal-row--link"
                data-url={l.url}
                onclick={handleNavigate}
                aria-label={l.ariaLabel}
                title={l.ariaLabel}
              >
                <template lwc:if={l.icon}>
                  <span class="gnal-icon-wrapper" style={l.iconStyle}>
                    <lightning-icon
                      class="gnal-icon"
                      icon-name={l.icon}
                      alternative-text={l.label}
                      title={l.label}
                      size="small"
                    ></lightning-icon>
                  </span>
                </template>
                <div class="gnal-mid">
                  <div class="gnal-primary">{l.label}</div>
                  <template lwc:if={l.subText}>
                    <div class="gnal-sub">{l.subText}</div>
                  </template>
                </div>
                <template lwc:if={l.hasRightContent}>
                  <div class="gnal-right-block">
                    <template lwc:if={l.rightText}>
                      <span class="gnal-right">{l.rightText}</span>
                    </template>
                    <template lwc:if={l.rightIcon}>
                      <span class="gnal-right-icon" aria-hidden="true">
                        <lightning-icon
                          class="gnal-right-icon__icon"
                          icon-name={l.rightIcon}
                          size="xx-small"
                          alternative-text=""
                          title=""
                        ></lightning-icon>
                      </span>
                    </template>
                  </div>
                </template>
              </a>
            </template>
            <template lwc:elseif={l.isDisabled}>
              <div class="gnal-row gnal-row--disabled" aria-disabled="true">
                <template lwc:if={l.icon}>
                  <span class="gnal-icon-wrapper" style={l.iconStyle}>
                    <lightning-icon
                      class="gnal-icon"
                      icon-name={l.icon}
                      alternative-text={l.label}
                      title={l.label}
                      size="small"
                    ></lightning-icon>
                  </span>
                </template>
                <div class="gnal-mid">
                  <div class="gnal-primary">{l.label}</div>
                  <template lwc:if={l.subText}>
                    <div class="gnal-sub">{l.subText}</div>
                  </template>
                </div>
                <template lwc:if={l.hasRightContent}>
                  <div class="gnal-right-block">
                    <template lwc:if={l.rightText}>
                      <span class="gnal-right">{l.rightText}</span>
                    </template>
                    <template lwc:if={l.rightIcon}>
                      <span class="gnal-right-icon" aria-hidden="true">
                        <lightning-icon
                          class="gnal-right-icon__icon"
                          icon-name={l.rightIcon}
                          size="xx-small"
                          alternative-text=""
                          title=""
                        ></lightning-icon>
                      </span>
                    </template>
                  </div>
                </template>
              </div>
            </template>
            <template lwc:else>
              <div class="gnal-row">
                <template lwc:if={l.icon}>
                  <span class="gnal-icon-wrapper" style={l.iconStyle}>
                    <lightning-icon
                      class="gnal-icon"
                      icon-name={l.icon}
                      alternative-text={l.label}
                      title={l.label}
                      size="small"
                    ></lightning-icon>
                  </span>
                </template>
                <div class="gnal-mid">
                  <div class="gnal-primary">{l.label}</div>
                  <template lwc:if={l.subText}>
                    <div class="gnal-sub">{l.subText}</div>
                  </template>
                </div>
                <template lwc:if={l.hasRightContent}>
                  <div class="gnal-right-block">
                    <template lwc:if={l.rightText}>
                      <span class="gnal-right">{l.rightText}</span>
                    </template>
                    <template lwc:if={l.rightIcon}>
                      <span class="gnal-right-icon" aria-hidden="true">
                        <lightning-icon
                          class="gnal-right-icon__icon"
                          icon-name={l.rightIcon}
                          size="xx-small"
                          alternative-text=""
                          title=""
                        ></lightning-icon>
                      </span>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </li>
        </template>
      </ul>

      <template lwc:if={footerUrlResolved}>
        <lightning-layout class="gnal-footer" horizontal-align="center">
          <lightning-layout-item>
            <lightning-button
              variant="base"
              label={footerLabelResolved}
              data-url={footerUrlResolved}
              onclick={handleLearnMore}
            ></lightning-button>
          </lightning-layout-item>
        </lightning-layout>
      </template>
    </div>
  </lightning-card>
</template>
