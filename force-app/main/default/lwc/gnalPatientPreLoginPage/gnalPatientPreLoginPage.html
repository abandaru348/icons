<template>
    <section class="prelogin slds-p-around_large">
        <lightning-card title="Welcome to My Military Health">
            <div class="slds-p-around_medium">
                <p class="slds-m-bottom_medium">
                    Sign in to access your personalized care team, appointments, referrals, and virtual care tools.
                </p>
                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                    <lightning-button
                        variant="brand"
                        label="Sign In"
                        onclick={handleLogin}
                    ></lightning-button>
                    <template lwc:if={resolvedCreateAccountUrl}>
                        <lightning-button
                            variant="neutral"
                            label="Create Account"
                            onclick={handleCreateAccount}
                        ></lightning-button>
                    </template>
                </div>
            </div>
        </lightning-card>
    </section>

    <section class="prelogin-tiles slds-p-around_large">
        <lightning-layout multiple-rows class="tile-equalizer" vertical-align="stretch">
            <lightning-layout-item size="12" medium-device-size="6" large-device-size="4" padding="around-small">
                <div class="tile-wrapper">
                    <c-gnal-tile-component
                        title="Symptom Checker and Self-Help Capabilities"
                        aria-title-label="Symptom Checker and Self-Help Capabilities"
                        description="Self-Help Capabilities include an online symptom checker to explore causes and get guidance on next steps."
                        links={selfHelpLinks}>
                    </c-gnal-tile-component>
                </div>
            </lightning-layout-item>

            <lightning-layout-item size="12" medium-device-size="6" large-device-size="4" padding="around-small">
                <div class="tile-wrapper">
                    <c-gnal-tile-component
                        title="Telehealth Registered Nurse Services"
                        aria-title-label="Telehealth Registered Nurse Services"
                        description="24/7 Telehealth RN and Care Coordination services. Please have your DOD Benefit Number (DBN) ready."
                        links={telehealthLinks}>
                    </c-gnal-tile-component>
                </div>
            </lightning-layout-item>

            <lightning-layout-item size="12" large-device-size="4" padding="around-small">
                <div class="tile-wrapper">
                    <c-gnal-tile-component
                        title="My Military Health"
                        aria-title-label="My Military Health"
                        description="My Military Health keeps you connected on your phone, tablet, or computer."
                        links={militaryLinks}>
                    </c-gnal-tile-component>
                </div>
            </lightning-layout-item>
        </lightning-layout>
    </section>
</template>
