<template>
    <lightning-card title="Find Nearest Facilities">
        <div class="slds-p-horizontal_medium slds-p-vertical_small">
            <lightning-input
                type="text"
                label="Current Location"
                value={currentLocation}
                onchange={handleLocationChange}
            ></lightning-input>

            <div class="slds-m-top_small">
                <lightning-button
                    label="Find"
                    variant="brand"
                    onclick={handleFind}
                    disabled={isLoading}
                ></lightning-button>
            </div>

            <template lwc:if={noticeMessage}>
                <div class="slds-m-top_small slds-box slds-theme_alert-texture slds-theme_info">
                    {noticeMessage}
                </div>
            </template>

            <template lwc:if={isLoading}>
                <div class="slds-m-top_medium">
                    <lightning-spinner alternative-text="Searching" size="small"></lightning-spinner>
                </div>
            </template>

            <template lwc:if={hasResults}>
                <div class="slds-m-top_medium">
                    <p class="slds-text-title_bold slds-m-bottom_x-small">Results</p>
                    <ul class="slds-has-dividers_bottom-space">
                        <template for:each={results} for:item="r">
                            <li key={r.address} class="slds-item slds-p-vertical_small">
                                <div class="slds-text-heading_small">{r.address}</div>
                                <div class="slds-text-body_small">{r.info}</div>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
