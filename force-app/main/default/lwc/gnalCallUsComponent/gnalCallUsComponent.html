<template>
    <section class="call-us-card" role="region" aria-label="Call Us">
        <div class="call-us-card__header slds-p-around_medium">
            <div class="slds-grid slds-grid_vertical-align-start">
                <div class="slds-m-right_medium">
                    <span class="call-us-card__icon" aria-hidden="true">
                        <img src={phoneIcon} alt="" />
                    </span>
                </div>

                <div class="slds-grow">
                    <h2 class="call-us-card__title slds-text-heading_medium">{title}</h2>
                    <p class="call-us-card__subtitle slds-text-body_small">{subtitle}</p>
                </div>
            </div>

            <div class="slds-m-top_medium">
                <p class="call-us-card__label slds-text-body_small">{supportLineLabel}</p>
                <p class="call-us-card__phone slds-text-heading_medium">
                    <a class="call-us-card__phone-link" href={telUrl} aria-label={callAriaLabel}>
                        {phoneNumberDisplay}
                    </a>
                </p>
            </div>

            <div class="slds-m-top_small slds-grid slds-grid_vertical-align-center">
                <lightning-icon
                    icon-name="utility:clock"
                    size="x-small"
                    alternative-text="Availability"
                    title="Availability"
                    class="call-us-card__clock slds-m-right_x-small"
                >
                </lightning-icon>
                <span class="slds-text-body_small slds-text-color_weak">{availabilityText}</span>
            </div>
        </div>

        <div class="call-us-card__divider" role="presentation"></div>

        <div class="call-us-card__footer slds-p-around_medium slds-text-align_center">
            <a class="call-us-card__cta" href={telUrl} aria-label={callAriaLabel}>
                <lightning-icon
                    icon-name="utility:call"
                    size="x-small"
                    alternative-text=""
                    title=""
                    class="call-us-card__cta-icon slds-m-right_small"
                >
                </lightning-icon>
                <span>{ctaLabel}</span>
            </a>
        </div>
    </section>
</template>
