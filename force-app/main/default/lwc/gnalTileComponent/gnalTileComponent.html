<template>
    <lightning-card>
        <lightning-layout class="tile-content slds-p-around_medium" multiple-rows vertical-align="stretch">
            <lightning-layout-item size="12" flexibility="auto">
                <!-- Title -->
                <h3 class="slds-text-heading_medium slds-m-bottom_small 
                           slds-text-align_left slds-medium-text-align_left title-text">
                   <strong>{title}</strong>
                </h3>

                <!-- Description -->
                <p class="slds-text-body_small slds-text-align_left slds-medium-text-align_left
                          slds-m-bottom_medium slds-text-color_weak">
                    {description}
                </p>

                <!-- Links -->
                <lightning-layout multiple-rows vertical-align="center">
                    <template for:each={links} for:item="l">
                        <lightning-layout-item key={l.label} size="12" class="slds-p-vertical_x-small">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <template lwc:if={l.iconName}>
                                    <lightning-icon 
                                        icon-name={l.iconName}
                                        size="small"
                                        class="slds-m-right_small"
                                        alternative-text={l.label}
                                        title={l.label}>
                                    </lightning-icon>
                                </template>
                                <span>{l.label}</span>
                            </div>
                        </lightning-layout-item>
                    </template>
                </lightning-layout>
            </lightning-layout-item>

            <template lwc:if={footerUrlResolved}>
                <lightning-layout-item size="12" class="slds-m-top_medium">
                    <hr class="tile-divider" />
                    <div class="slds-m-top_small slds-text-align_center">
                        <a class="slds-text-link" data-url={footerUrlResolved} onclick={handleLearnMore}>
                            {footerLabelResolved}
                        </a>
                    </div>
                </lightning-layout-item>
            </template>
        </lightning-layout>
    </lightning-card>
</template>
