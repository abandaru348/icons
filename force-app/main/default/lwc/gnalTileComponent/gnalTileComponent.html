<template>
    <lightning-card class="tile-card" style="height: 100%">
        <div class="tile-content slds-p-around_medium">
            <div class="tile-body">
                <!-- Title -->
                <lightning-formatted-text
                    value={title}
                    class="slds-text-heading_medium slds-m-bottom_small slds-text-align_left slds-medium-text-align_left title-text">
                </lightning-formatted-text>

                <!-- Description -->
                <p class="slds-text-body_small slds-text-align_left slds-medium-text-align_left slds-m-bottom_medium slds-text-color_weak">
                    {description}
                </p>

                <!-- Links -->
                <lightning-layout multiple-rows vertical-align="center">
                    <template for:each={links} for:item="l">
                        <lightning-layout-item key={l.label} size="12" class="slds-p-vertical_x-small">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <template lwc:if={l.iconName}>
                                    <lightning-icon
                                        icon-name={l.iconName}
                                        size="small"
                                        class="slds-m-right_small"
                                        alternative-text={l.label}
                                        title={l.label}>
                                    </lightning-icon>
                                </template>
                                <span>{l.label}</span>
                            </div>
                        </lightning-layout-item>
                    </template>
                </lightning-layout>
            </div>

            <template lwc:if={footerUrlResolved}>
                <div class="tile-footer slds-m-top_medium">
                    <hr class="tile-divider" />
                    <div class="slds-m-top_small slds-text-align_center">
                        <a class="slds-text-link" data-url={footerUrlResolved} onclick={handleLearnMore}>
                            {footerLabelResolved}
                        </a>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
