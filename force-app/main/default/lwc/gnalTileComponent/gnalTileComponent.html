<template>
    <lightning-card class="one-size-card">
        <div class="one-size-card tile-content slds-p-around_medium">
            <h3 class="slds-text-heading_medium slds-m-bottom_small slds-text-align_left title-text">
                {title}
            </h3>
            <p class="slds-text-body_small slds-text-align_left slds-m-bottom_medium slds-text-color_weak">
                {description}
            </p>

            <lightning-layout multiple-rows vertical-align="center">
                <template for:each={links} for:item="l">
                    <lightning-layout-item key={l.label} size="12" class="slds-p-vertical_x-small">
                        <a
                            class={linkClass}
                            href={l.url}
                            data-url={l.url}
                            target="_blank"
                            rel="noopener noreferrer"
                            onclick={handleLinkClick}
                        >
                            <template lwc:if={l.iconName}>
                                <lightning-icon
                                    icon-name={l.iconName}
                                    size="small"
                                    class="slds-m-right_small"
                                    alternative-text={l.label}
                                    title={l.label}
                                >
                                </lightning-icon>
                            </template>
                            <span class="tile-link__label">{l.label}</span>
                        </a>
                    </lightning-layout-item>
                </template>
            </lightning-layout>
        </div>

        <template lwc:if={footerUrlResolved}>
            <div slot="footer" class="slds-text-align_center">
                <a class="slds-text-link" data-url={footerUrlResolved} onclick={handleLearnMore}>
                    {footerLabelResolved}
                </a>
            </div>
        </template>
    </lightning-card>
</template>
