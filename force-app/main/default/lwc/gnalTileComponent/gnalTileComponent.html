<template>
  <lightning-card class="tile-card">
    <div class="tile-content slds-p-around_medium">
      <h3 class="slds-text-heading_medium slds-m-bottom_small slds-text-align_center slds-medium-text-align_left title-text">
        <strong>{title}</strong>
      </h3>

      <p class="slds-text-body_small slds-text-align_center slds-medium-text-align_left slds-m-bottom_medium slds-text-color_weak">
        {description}
      </p>

      <lightning-layout multiple-rows vertical-align="center" class="tile-links">
        <template for:each={normalizedLinks} for:item="link">
          <lightning-layout-item key={link.key} size="12" class="slds-p-vertical_x-small">
            <template lwc:if={link.url}>
              <button
                type="button"
                class="tile-link slds-grid slds-grid_vertical-align-center slds-text-align_left"
                data-url={link.url}
                onclick={handleLinkClick}
              >
                <lightning-icon
                  icon-name={link.iconName}
                  size="small"
                  class="slds-m-right_small"
                  alternative-text={link.label}
                  title={link.label}
                ></lightning-icon>
                <span>{link.label}</span>
              </button>
            </template>
            <template lwc:else>
              <div class="tile-link tile-link--static slds-grid slds-grid_vertical-align-center">
                <lightning-icon
                  icon-name={link.iconName}
                  size="small"
                  class="slds-m-right_small"
                  alternative-text={link.label}
                  title={link.label}
                ></lightning-icon>
                <span>{link.label}</span>
              </div>
            </template>
          </lightning-layout-item>
        </template>
      </lightning-layout>

      <hr class="tile-divider" />

      <template lwc:if={footerUrlResolved}>
        <div class="slds-m-top_small slds-text-align_center">
          <a class="slds-text-link" data-url={footerUrlResolved} onclick={handleLearnMore}>
            {footerLabelResolved}
          </a>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
