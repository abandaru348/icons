<template>
    <lightning-card class="tile-card">
        <div class="tile-content slds-p-around_medium">
            <div class="tile-body">
                <!-- Title -->
                <lightning-formatted-text
                    value={title}
                    class="slds-text-heading_medium slds-m-bottom_small slds-text-align_left slds-medium-text-align_left title-text">
                </lightning-formatted-text>

                <!-- Description -->
                <p class="slds-text-body_small slds-text-align_left slds-medium-text-align_left slds-m-bottom_medium slds-text-color_weak">
                    {description}
                </p>

                <!-- Links -->
                <lightning-layout class="tile-links" multiple-rows vertical-align="center">
                    <template for:each={normalizedLinks} for:item="link">
                        <lightning-layout-item key={link.key} size="12" class="slds-p-vertical_x-small">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <template lwc:if={link.iconName}>
                                    <lightning-icon
                                        icon-name={link.iconName}
                                        size={link.iconSize}
                                        class={link.iconClass}
                                        style={link.iconStyle}
                                        variant={link.iconVariant}
                                        alternative-text={link.alternativeText}
                                        title={link.title}>
                                    </lightning-icon>
                                </template>
                                <template lwc:if={link.isClickable}>
                                    <a
                                        class="tile-link"
                                        href={link.url}
                                        data-url={link.url}
                                        onclick={handleLinkClick}>
                                        {link.label}
                                    </a>
                                </template>
                                <template lwc:else>
                                    <span class="tile-link__label">{link.label}</span>
                                </template>
                            </div>
                        </lightning-layout-item>
                    </template>
                </lightning-layout>
            </div>

            <template lwc:if={footerUrlResolved}>
                <div class="tile-footer slds-m-top_medium">
                    <hr class="tile-divider" />
                    <div class="slds-m-top_small slds-text-align_center">
                        <a class="slds-text-link" data-url={footerUrlResolved} onclick={handleLearnMore}>
                            {footerLabelResolved}
                        </a>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
